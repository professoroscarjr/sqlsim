<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador SQL Interativo - MariaDB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .code-font {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden font-sans">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <i class="fa-solid font-bold text-2xl text-teal-400 fa-database"></i>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-white">MariaDB SQL Simulator</h1>
                <p class="text-xs text-gray-400">Ambiente Didático de Aprendizado SQL</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span id="active-db-badge" class="bg-teal-900/60 text-teal-300 text-xs px-3 py-1 rounded-full border border-teal-700/50 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                Nenhum BD selecionado
            </span>
            <button onclick="resetEngine()" class="px-3 py-1.5 text-xs bg-red-900/40 hover:bg-red-800/60 text-red-300 rounded border border-red-700/50 transition flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> Reiniciar Banco
            </button>
            <button onclick="exportDatabase()" class="px-3 py-1.5 text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 rounded border border-gray-600 transition flex items-center gap-1">
                <i class="fa-solid fa-download"></i> Exportar SQL
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Left: DB Explorer & Tutorials -->
        <aside class="w-80 bg-gray-800/80 border-r border-gray-700 flex flex-col shrink-0">
            <!-- Tabs -->
            <div class="flex border-b border-gray-700 text-xs font-semibold">
                <button id="tab-explorer-btn" onclick="switchSidebarTab('explorer')" class="flex-1 py-3 text-center border-b-2 border-teal-400 text-teal-400 bg-gray-800/50">
                    <i class="fa-solid fa-sitemap mr-1"></i> Estrutura BD
                </button>
                <button id="tab-lessons-btn" onclick="switchSidebarTab('lessons')" class="flex-1 py-3 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200">
                    <i class="fa-solid fa-graduation-cap mr-1"></i> Exercícios
                </button>
            </div>

            <!-- Tab Content 1: Database Explorer -->
            <div id="tab-explorer" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="flex items-center justify-between text-xs font-bold text-gray-400 uppercase tracking-wider">
                    <span>Bancos de Dados</span>
                    <button onclick="refreshExplorer()" class="hover:text-teal-400 transition" title="Atualizar Visualização">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>
                <div id="db-tree" class="space-y-2 text-sm">
                    <!-- Dynamic DB Tree generated by JS -->
                </div>
            </div>

            <!-- Tab Content 2: Guided Lessons -->
            <div id="tab-lessons" class="flex-1 overflow-y-auto p-4 space-y-4 hidden">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Roteiro Prático</h3>
                
                <div class="space-y-3" id="lessons-list">
                    <!-- Lessons rendered via JS -->
                </div>
            </div>
        </aside>

        <!-- Right Side: Editor & Output -->
        <main class="flex-1 flex flex-col min-w-0 bg-gray-900">
            
            <!-- SQL Editor Section -->
            <div class="flex-1 flex flex-col min-h-0 border-b border-gray-700 relative">
                <!-- Editor Toolbar -->
                <div class="bg-gray-800/50 px-4 py-2 border-b border-gray-700/60 flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-terminal text-teal-400"></i> Console SQL
                    </span>
                    <div class="flex items-center space-x-2">
                        <button onclick="clearEditor()" class="px-2.5 py-1 text-xs text-gray-400 hover:text-gray-200 bg-gray-800 hover:bg-gray-700 rounded transition border border-gray-600">
                            Limpar
                        </button>
                        <button onclick="executeSQL()" class="px-4 py-1.5 text-xs bg-teal-600 hover:bg-teal-500 text-white font-bold rounded shadow transition flex items-center gap-1.5">
                            <i class="fa-solid fa-play"></i> Executar (Ctrl+Enter)
                        </button>
                    </div>
                </div>

                <!-- Textarea Editor -->
                <div class="flex-1 relative">
                    <textarea id="sql-editor" spellcheck="false" class="w-full h-full bg-gray-950 text-emerald-400 p-4 code-font text-sm resize-none focus:outline-none focus:ring-1 focus:ring-teal-500/50" placeholder="-- Digite seus comandos SQL aqui (ex: CREATE DATABASE aula; USE aula;)"></textarea>
                </div>
            </div>

            <!-- Execution Results / Table Area -->
            <div class="h-1/2 flex flex-col bg-gray-950 min-h-0">
                <!-- Status Header -->
                <div class="bg-gray-800/80 px-4 py-2 border-b border-gray-700/60 flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold text-gray-300">Resultado da Execução</span>
                        <span id="execution-time" class="text-gray-500"></span>
                    </div>
                    <div id="status-indicator" class="text-gray-400 text-xs">Pronto</div>
                </div>

                <!-- Result Content -->
                <div id="result-container" class="flex-1 overflow-auto p-4">
                    <div class="text-gray-500 text-sm italic flex flex-col items-center justify-center h-full space-y-2">
                        <i class="fa-solid fa-code text-3xl opacity-30"></i>
                        <p>Execute um comando SQL acima para visualizar os resultados.</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        //  DATABASE IN-MEMORY ENGINE SIMULATION
        // ==========================================
        
        class MariaDBEngine {
            constructor() {
                this.loadFromStorage();
            }

            saveToStorage() {
                const data = {
                    databases: this.databases,
                    currentDB: this.currentDB
                };
                localStorage.setItem('mariadb_sim_data', JSON.stringify(data));
            }

            loadFromStorage() {
                const data = localStorage.getItem('mariadb_sim_data');
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        this.databases = parsed.databases || {};
                        this.currentDB = parsed.currentDB || null;
                    } catch(e) {
                        this.initDefaults();
                    }
                } else {
                    this.initDefaults();
                }
            }

            initDefaults() {
                this.databases = {
                    'escola': {
                        tables: {
                            'alunos': {
                                columns: [
                                    { name: 'id', type: 'INT', pk: true, autoIncrement: true },
                                    { name: 'nome', type: 'VARCHAR(100)', pk: false },
                                    { name: 'idade', type: 'INT', pk: false },
                                    { name: 'curso', type: 'VARCHAR(50)', pk: false }
                                ],
                                data: [
                                    { id: 1, nome: 'Ana Silva', idade: 20, curso: 'Informatica' },
                                    { id: 2, nome: 'Carlos Souza', idade: 22, curso: 'Edificacoes' },
                                    { id: 3, nome: 'Mariana Lima', idade: 19, curso: 'Informatica' }
                                ]
                            }
                        }
                    }
                };
                this.currentDB = 'escola';
                this.saveToStorage();
            }

            reset() {
                localStorage.removeItem('mariadb_sim_data');
                this.initDefaults();
            }

            // Engine Query Processor
            execute(query) {
                const cleanQuery = query.trim().replace(/--.*$/gm, ''); // Strip single line comments
                if (!cleanQuery) return { type: 'info', message: 'Nenhum comando executável encontrado.' };

                // Split commands by semicolon, but ignore empty ones
                const statements = cleanQuery.split(';')
                    .map(s => s.trim())
                    .filter(s => s.length > 0);

                let results = [];
                for (let stmt of statements) {
                    try {
                        const res = this.processStatement(stmt);
                        results.push(res);
                    } catch (err) {
                        results.push({ type: 'error', message: err.message, statement: stmt });
                        break; // Stop on first error like standard SQL
                    }
                }
                this.saveToStorage();
                return results;
            }

            processStatement(sql) {
                const tokens = sql.split(/\s+/);
                const command = tokens[0].toUpperCase();

                switch (command) {
                    case 'SHOW':
                        return this.handleShow(tokens, sql);
                    case 'CREATE':
                        return this.handleCreate(tokens, sql);
                    case 'USE':
                        return this.handleUse(tokens);
                    case 'INSERT':
                        return this.handleInsert(sql);
                    case 'SELECT':
                        return this.handleSelect(sql);
                    case 'UPDATE':
                        return this.handleUpdate(sql);
                    case 'DELETE':
                        return this.handleDelete(sql);
                    case 'DROP':
                        return this.handleDrop(tokens, sql);
                    case 'ALTER':
                        return this.handleAlter(sql);
                    default:
                        throw new Error(`Sintaxe SQL não suportada ou erro perto de '${tokens[0]}'.`);
                }
            }

            handleShow(tokens, sql) {
                const target = tokens[1] ? tokens[1].toUpperCase() : '';
                if (target === 'DATABASES') {
                    const rows = Object.keys(this.databases).map(db => ({ Database: db }));
                    return { type: 'select', columns: ['Database'], data: rows, affectedRows: rows.length };
                } else if (target === 'TABLES') {
                    if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado. Use 'USE nome_bd;' primeiro.");
                    const tables = Object.keys(this.databases[this.currentDB].tables);
                    const colName = `Tables_in_${this.currentDB}`;
                    const rows = tables.map(t => ({ [colName]: t }));
                    return { type: 'select', columns: [colName], data: rows, affectedRows: rows.length };
                }
                throw new Error("Comando SHOW inválido. Tente 'SHOW DATABASES;' ou 'SHOW TABLES;'.");
            }

            handleUse(tokens) {
                const dbName = tokens[1] ? tokens[1].replace(/`/g, '').replace(';', '') : null;
                if (!dbName || !this.databases[dbName]) {
                    throw new Error(`Banco de dados desconhecido '${dbName}'.`);
                }
                this.currentDB = dbName;
                return { type: 'success', message: `Banco de dados alterado para '${dbName}'` };
            }

            handleCreate(tokens, sql) {
                const type = tokens[1] ? tokens[1].toUpperCase() : '';
                
                if (type === 'DATABASE') {
                    const dbName = tokens[2].replace(/`/g, '').replace(';', '');
                    if (this.databases[dbName]) {
                        throw new Error(`Impossível criar o banco '${dbName}'; ele já existe.`);
                    }
                    this.databases[dbName] = { tables: {} };
                    return { type: 'success', message: `Database '${dbName}' criado com sucesso.` };
                }

                if (type === 'TABLE') {
                    if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado.");
                    
                    const match = sql.match(/CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?`?(\w+)`?\s*\(([\s\S]+)\)/i);
                    if (!match) throw new Error("Sintaxe incorreta para CREATE TABLE.");

                    const tableName = match[1];
                    const body = match[2];

                    if (this.databases[this.currentDB].tables[tableName]) {
                        throw new Error(`Tabela '${tableName}' já existe.`);
                    }

                    // Parse columns
                    const colDefs = body.split(',').map(c => c.trim());
                    const columns = [];

                    for (let colDef of colDefs) {
                        const parts = colDef.split(/\s+/);
                        const cName = parts[0].replace(/`/g, '');
                        const cType = parts[1] ? parts[1].toUpperCase() : 'VARCHAR(255)';
                        const isPk = colDef.toUpperCase().includes('PRIMARY KEY');
                        const isAuto = colDef.toUpperCase().includes('AUTO_INCREMENT');

                        columns.push({
                            name: cName,
                            type: cType,
                            pk: isPk,
                            autoIncrement: isAuto
                        });
                    }

                    this.databases[this.currentDB].tables[tableName] = {
                        columns: columns,
                        data: []
                    };

                    return { type: 'success', message: `Tabela '${tableName}' criada com sucesso.` };
                }

                throw new Error("Comando CREATE inválido.");
            }

            handleInsert(sql) {
                if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado.");

                const regex = /INSERT\s+INTO\s+`?(\w+)`?\s*(?:\(([^)]+)\))?\s*VALUES\s*\(([^)]+)\)/i;
                const match = sql.match(regex);

                if (!match) throw new Error("Sintaxe de INSERT incorreta. Exemplo: INSERT INTO tabela (col1) VALUES ('val1');");

                const tableName = match[1];
                const colsRaw = match[2];
                const valsRaw = match[3];

                const table = this.databases[this.currentDB].tables[tableName];
                if (!table) throw new Error(`Tabela '${tableName}' não existe.`);

                let columnsToInsert = colsRaw 
                    ? colsRaw.split(',').map(c => c.trim().replace(/`/g, ''))
                    : table.columns.map(c => c.name);

                let valuesToInsert = valsRaw.split(',').map(v => {
                    v = v.trim();
                    if ((v.startsWith("'") && v.endsWith("'")) || (v.startsWith('"') && v.endsWith('"'))) {
                        return v.slice(1, -1);
                    }
                    if (!isNaN(v)) return Number(v);
                    if (v.toUpperCase() === 'NULL') return null;
                    return v;
                });

                if (columnsToInsert.length !== valuesToInsert.length) {
                    throw new Error("A contagem de colunas não corresponde à contagem de valores.");
                }

                let newRow = {};
                
                // Initialize default row with AUTO_INCREMENT or NULL
                table.columns.forEach(col => {
                    if (col.autoIncrement) {
                        const maxId = table.data.reduce((max, r) => Math.max(max, r[col.name] || 0), 0);
                        newRow[col.name] = maxId + 1;
                    } else {
                        newRow[col.name] = null;
                    }
                });

                // Assign explicitly provided values
                columnsToInsert.forEach((colName, idx) => {
                    const colObj = table.columns.find(c => c.name === colName);
                    if (!colObj) throw new Error(`Coluna desconhecida '${colName}' na tabela '${tableName}'`);
                    newRow[colName] = valuesToInsert[idx];
                });

                table.data.push(newRow);
                return { type: 'success', message: `1 linha inserida com sucesso em '${tableName}'.` };
            }

            handleSelect(sql) {
                if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado.");

                // Simplified SELECT matching
                const regex = /SELECT\s+(.+)\s+FROM\s+`?(\w+)`?(?:\s+WHERE\s+(.+))?/i;
                const match = sql.match(regex);

                if (!match) throw new Error("Sintaxe SELECT incorreta. Exemplo: SELECT * FROM tabela WHERE col = 'val';");

                const colsClause = match[1].trim();
                const tableName = match[2].trim();
                const whereClause = match[3] ? match[3].trim() : null;

                const table = this.databases[this.currentDB].tables[tableName];
                if (!table) throw new Error(`Tabela '${tableName}' não existe.`);

                let resultData = [...table.data];

                // WHERE filtering
                if (whereClause) {
                    resultData = resultData.filter(row => this.evaluateWhere(row, whereClause));
                }

                // Columns selection
                let selectedCols = [];
                if (colsClause === '*') {
                    selectedCols = table.columns.map(c => c.name);
                } else {
                    selectedCols = colsClause.split(',').map(c => c.trim().replace(/`/g, ''));
                }

                // Project columns
                const finalRows = resultData.map(row => {
                    let newRow = {};
                    selectedCols.forEach(col => {
                        newRow[col] = row[col] !== undefined ? row[col] : null;
                    });
                    return newRow;
                });

                return {
                    type: 'select',
                    columns: selectedCols,
                    data: finalRows,
                    affectedRows: finalRows.length
                };
            }

            handleUpdate(sql) {
                if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado.");

                const regex = /UPDATE\s+`?(\w+)`?\s+SET\s+(.+?)(?:\s+WHERE\s+(.+))?$/i;
                const match = sql.match(regex);

                if (!match) throw new Error("Sintaxe UPDATE incorreta. Exemplo: UPDATE tabela SET col = 'val' WHERE id = 1;");

                const tableName = match[1];
                const setClause = match[2];
                const whereClause = match[3];

                const table = this.databases[this.currentDB].tables[tableName];
                if (!table) throw new Error(`Tabela '${tableName}' não existe.`);

                // Parse SET key=value pairs
                const assignments = setClause.split(',').map(assign => {
                    const [col, val] = assign.split('=').map(s => s.trim());
                    let cleanVal = val;
                    if ((val.startsWith("'") && val.endsWith("'")) || (val.startsWith('"') && val.endsWith('"'))) {
                        cleanVal = val.slice(1, -1);
                    } else if (!isNaN(val)) {
                        cleanVal = Number(val);
                    }
                    return { col: col.replace(/`/g, ''), val: cleanVal };
                });

                let updatedCount = 0;
                table.data.forEach(row => {
                    if (!whereClause || this.evaluateWhere(row, whereClause)) {
                        assignments.forEach(a => {
                            row[a.col] = a.val;
                        });
                        updatedCount++;
                    }
                });

                return { type: 'success', message: `UPDATE concluído. ${updatedCount} linha(s) afetada(s).` };
            }

            handleDelete(sql) {
                if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado.");

                const regex = /DELETE\s+FROM\s+`?(\w+)`?(?:\s+WHERE\s+(.+))?/i;
                const match = sql.match(regex);

                if (!match) throw new Error("Sintaxe DELETE incorreta. Exemplo: DELETE FROM tabela WHERE id = 1;");

                const tableName = match[1];
                const whereClause = match[2];

                const table = this.databases[this.currentDB].tables[tableName];
                if (!table) throw new Error(`Tabela '${tableName}' não existe.`);

                const initialLength = table.data.length;
                if (!whereClause) {
                    table.data = [];
                } else {
                    table.data = table.data.filter(row => !this.evaluateWhere(row, whereClause));
                }

                const deletedCount = initialLength - table.data.length;
                return { type: 'success', message: `DELETE concluído. ${deletedCount} linha(s) removida(s).` };
            }

            handleDrop(tokens, sql) {
                const targetType = tokens[1] ? tokens[1].toUpperCase() : '';
                const targetName = tokens[2] ? tokens[2].replace(/`/g, '').replace(';', '') : '';

                if (targetType === 'DATABASE') {
                    if (!this.databases[targetName]) throw new Error(`Não foi possível apagar '${targetName}'; banco não existe.`);
                    delete this.databases[targetName];
                    if (this.currentDB === targetName) this.currentDB = null;
                    return { type: 'success', message: `Banco de dados '${targetName}' excluído.` };
                }

                if (targetType === 'TABLE') {
                    if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado.");
                    if (!this.databases[this.currentDB].tables[targetName]) {
                        throw new Error(`Tabela '${targetName}' não existe.`);
                    }
                    delete this.databases[this.currentDB].tables[targetName];
                    return { type: 'success', message: `Tabela '${targetName}' excluída.` };
                }

                throw new Error("Sintaxe DROP incorreta. Use DROP DATABASE nome; ou DROP TABLE nome;");
            }

            handleAlter(sql) {
                if (!this.currentDB) throw new Error("Nenhum banco de dados selecionado.");
                const regex = /ALTER\s+TABLE\s+`?(\w+)`?\s+ADD\s+`?(\w+)`?\s+(.+)/i;
                const match = sql.match(regex);

                if (!match) throw new Error("Sintaxe ALTER TABLE suportada no momento: ALTER TABLE nome ADD col TIPO;");

                const tableName = match[1];
                const newColName = match[2];
                const newColType = match[3].replace(';', '').trim().toUpperCase();

                const table = this.databases[this.currentDB].tables[tableName];
                if (!table) throw new Error(`Tabela '${tableName}' não existe.`);

                table.columns.push({ name: newColName, type: newColType, pk: false, autoIncrement: false });
                table.data.forEach(row => row[newColName] = null);

                return { type: 'success', message: `Coluna '${newColName}' adicionada à tabela '${tableName}'.` };
            }

            // Simple Helper for WHERE evaluations (supports '=', '>', '<', 'LIKE', '!=')
            evaluateWhere(row, whereClause) {
                // Support simple binary expressions: col = 'value'
                const match = whereClause.match(/`?(\w+)`?\s*(=|>|<|!=|LIKE)\s*(.+)/i);
                if (!match) return true; // fallback if complex expression

                const col = match[1];
                const op = match[2].toUpperCase();
                let val = match[3].trim();

                if ((val.startsWith("'") && val.endsWith("'")) || (val.startsWith('"') && val.endsWith('"'))) {
                    val = val.slice(1, -1);
                } else if (!isNaN(val)) {
                    val = Number(val);
                }

                const rowVal = row[col];

                switch (op) {
                    case '=': return rowVal == val;
                    case '!=': return rowVal != val;
                    case '>': return rowVal > val;
                    case '<': return rowVal < val;
                    case 'LIKE':
                        const pattern = val.replace(/%/g, '.*');
                        return new RegExp(`^${pattern}$`, 'i').test(rowVal);
                    default: return true;
                }
            }
        }

        // Initialize Global Engine
        const dbEngine = new MariaDBEngine();

        // ==========================================
        //  UI CONTROLLERS & INTERACTION LOGIC
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            refreshExplorer();
            renderLessons();
            
            // Keybindings
            document.getElementById('sql-editor').addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    executeSQL();
                }
            });
        });

        function switchSidebarTab(tab) {
            const expTab = document.getElementById('tab-explorer');
            const lesTab = document.getElementById('tab-lessons');
            const expBtn = document.getElementById('tab-explorer-btn');
            const lesBtn = document.getElementById('tab-lessons-btn');

            if (tab === 'explorer') {
                expTab.classList.remove('hidden');
                lesTab.classList.add('hidden');
                expBtn.className = "flex-1 py-3 text-center border-b-2 border-teal-400 text-teal-400 bg-gray-800/50";
                lesBtn.className = "flex-1 py-3 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200";
            } else {
                expTab.classList.add('hidden');
                lesTab.classList.remove('hidden');
                lesBtn.className = "flex-1 py-3 text-center border-b-2 border-teal-400 text-teal-400 bg-gray-800/50";
                expBtn.className = "flex-1 py-3 text-center border-b-2 border-transparent text-gray-400 hover:text-gray-200";
            }
        }

        function refreshExplorer() {
            const tree = document.getElementById('db-tree');
            const activeBadge = document.getElementById('active-db-badge');
            
            tree.innerHTML = '';

            if (dbEngine.currentDB) {
                activeBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span> DB Ativo: <strong class="text-white">${dbEngine.currentDB}</strong>`;
            } else {
                activeBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> Nenhum BD Selecionado`;
            }

            const dbNames = Object.keys(dbEngine.databases);
            if (dbNames.length === 0) {
                tree.innerHTML = `<p class="text-gray-500 text-xs italic">Nenhum banco de dados criado.</p>`;
                return;
            }

            dbNames.forEach(dbName => {
                const isCurrent = dbName === dbEngine.currentDB;
                const dbElement = document.createElement('div');
                dbElement.className = `rounded p-2 transition ${isCurrent ? 'bg-gray-700/80 border border-teal-500/40' : 'bg-gray-800/50 hover:bg-gray-700/40'}`;

                const tables = Object.keys(dbEngine.databases[dbName].tables);

                let tablesHTML = '';
                if (tables.length > 0) {
                    tablesHTML = `<div class="ml-4 mt-2 space-y-1 border-l border-gray-600 pl-2">`;
                    tables.forEach(tName => {
                        const cols = dbEngine.databases[dbName].tables[tName].columns;
                        tablesHTML += `
                            <div class="group">
                                <div class="flex items-center justify-between text-xs text-gray-300 py-0.5 hover:text-teal-300 cursor-pointer" onclick="setQueryToEditor('SELECT * FROM ${tName};')">
                                    <span class="flex items-center gap-1.5">
                                        <i class="fa-solid fa-table text-gray-500 group-hover:text-teal-400"></i> ${tName}
                                    </span>
                                    <span class="text-[10px] text-gray-500">(${dbEngine.databases[dbName].tables[tName].data.length})</span>
                                </div>
                                <div class="ml-3 text-[11px] text-gray-500 space-y-0.5 hidden group-hover:block">
                                    ${cols.map(c => `<div>• ${c.name} <span class="text-gray-600">(${c.type})</span></div>`).join('')}
                                </div>
                            </div>
                        `;
                    });
                    tablesHTML += `</div>`;
                } else {
                    tablesHTML = `<div class="ml-4 mt-1 text-[11px] text-gray-500 italic">Sem tabelas</div>`;
                }

                dbElement.innerHTML = `
                    <div class="flex items-center justify-between font-medium cursor-pointer" onclick="setQueryToEditor('USE ${dbName};')">
                        <span class="flex items-center gap-2 ${isCurrent ? 'text-teal-300 font-bold' : 'text-gray-300'}">
                            <i class="fa-solid fa-database ${isCurrent ? 'text-teal-400' : 'text-gray-500'}"></i>
                            ${dbName}
                        </span>
                        ${isCurrent ? '<span class="text-[10px] bg-teal-900 text-teal-300 px-1.5 py-0.5 rounded">EM USO</span>' : ''}
                    </div>
                    ${tablesHTML}
                `;

                tree.appendChild(dbElement);
            });
        }

        function setQueryToEditor(sql) {
            const editor = document.getElementById('sql-editor');
            editor.value = sql;
            editor.focus();
        }

        function clearEditor() {
            document.getElementById('sql-editor').value = '';
        }

        function executeSQL() {
            const editor = document.getElementById('sql-editor');
            const resultContainer = document.getElementById('result-container');
            const execTimeEl = document.getElementById('execution-time');
            const statusInd = document.getElementById('status-indicator');

            const sql = editor.value;
            if (!sql.trim()) return;

            const startTime = performance.now();
            const results = dbEngine.execute(sql);
            const endTime = performance.now();

            execTimeEl.innerText = `(${(endTime - startTime).toFixed(2)} ms)`;
            resultContainer.innerHTML = '';

            let hasError = false;

            results.forEach((res, index) => {
                const resDiv = document.createElement('div');
                resDiv.className = 'mb-4 last:mb-0';

                if (res.type === 'error') {
                    hasError = true;
                    resDiv.innerHTML = `
                        <div class="bg-red-950/80 border border-red-800/80 text-red-200 p-3 rounded text-xs space-y-1 font-mono">
                            <div class="font-bold flex items-center gap-2">
                                <i class="fa-solid fa-triangle-exclamation text-red-400"></i> Erro de Execução
                            </div>
                            <div>${res.message}</div>
                            ${res.statement ? `<div class="text-red-400/70 text-[11px] mt-1">Comando: "${res.statement}"</div>` : ''}
                        </div>
                    `;
                } else if (res.type === 'success') {
                    resDiv.innerHTML = `
                        <div class="bg-emerald-950/50 border border-emerald-800/50 text-emerald-300 p-2.5 rounded text-xs flex items-center gap-2">
                            <i class="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>${res.message}</span>
                        </div>
                    `;
                } else if (res.type === 'select') {
                    if (res.data.length === 0) {
                        resDiv.innerHTML = `
                            <div class="text-gray-400 text-xs italic bg-gray-900 p-3 rounded border border-gray-800">
                                Consulta executada com sucesso. Nenhum registro retornado.
                            </div>
                        `;
                    } else {
                        let tableHTML = `
                            <div class="overflow-x-auto border border-gray-800 rounded">
                                <table class="w-full text-left text-xs text-gray-300 font-mono">
                                    <thead class="bg-gray-800/90 text-gray-200 uppercase font-semibold border-b border-gray-700">
                                        <tr>
                                            ${res.columns.map(c => `<th class="px-3 py-2 border-r border-gray-700/50 last:border-0">${c}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-800/60 bg-gray-900/60">
                        `;

                        res.data.forEach(row => {
                            tableHTML += `<tr class="hover:bg-gray-800/40">`;
                            res.columns.map(c => {
                                const val = row[c] === null ? '<span class="text-gray-600 italic">NULL</span>' : row[c];
                                tableHTML += `<td class="px-3 py-1.5 border-r border-gray-800/50 last:border-0">${val}</td>`;
                            });
                            tableHTML += `</tr>`;
                        });

                        tableHTML += `
                                    </tbody>
                                </table>
                            </div>
                            <div class="text-[11px] text-gray-500 mt-1">${res.affectedRows} linha(s) retornada(s).</div>
                        `;
                        resDiv.innerHTML = tableHTML;
                    }
                }

                resultContainer.appendChild(resDiv);
            });

            if (hasError) {
                statusInd.innerHTML = `<span class="text-red-400 font-semibold"><i class="fa-solid fa-xmark"></i> Falha</span>`;
            } else {
                statusInd.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-check"></i> Sucesso</span>`;
            }

            refreshExplorer();
        }

        function resetEngine() {
            if (confirm("Deseja realmente reiniciar todo o banco de dados para os valores padrão?")) {
                dbEngine.reset();
                refreshExplorer();
                document.getElementById('result-container').innerHTML = `
                    <div class="text-emerald-400 text-xs p-3 bg-emerald-950/40 rounded border border-emerald-800/50">
                        Banco de dados reiniciado com sucesso para o estado inicial.
                    </div>
                `;
            }
        }

        function exportDatabase() {
            let sqlDump = `-- Backup Gerado pelo Simulador MariaDB\n`;
            sqlDump += `-- Data: ${new Date().toLocaleString('pt-BR')}\n\n`;

            Object.keys(dbEngine.databases).forEach(dbName => {
                sqlDump += `CREATE DATABASE IF NOT EXISTS \`${dbName}\`;\n`;
                sqlDump += `USE \`${dbName}\`;\n\n`;

                const tables = dbEngine.databases[dbName].tables;
                Object.keys(tables).forEach(tName => {
                    const table = tables[tName];
                    sqlDump += `-- Estrutura para tabela \`${tName}\`\n`;
                    sqlDump += `DROP TABLE IF EXISTS \`${tName}\`;\n`;
                    sqlDump += `CREATE TABLE \`${tName}\` (\n`;
                    
                    const colDefs = table.columns.map(c => {
                        let def = `  \`${c.name}\` ${c.type}`;
                        if (c.pk) def += ` PRIMARY KEY`;
                        if (c.autoIncrement) def += ` AUTO_INCREMENT`;
                        return def;
                    });

                    sqlDump += colDefs.join(',\n') + `\n);\n\n`;

                    if (table.data.length > 0) {
                        sqlDump += `-- Inserindo dados na tabela \`${tName}\`\n`;
                        table.data.forEach(row => {
                            const cols = Object.keys(row).map(c => `\`${c}\``).join(', ');
                            const vals = Object.values(row).map(v => typeof v === 'string' ? `'${v}'` : (v === null ? 'NULL' : v)).join(', ');
                            sqlDump += `INSERT INTO \`${tName}\` (${cols}) VALUES (${vals});\n`;
                        });
                        sqlDump += `\n`;
                    }
                });
            });

            const blob = new Blob([sqlDump], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup_database_${Date.now()}.sql`;
            a.click();
        }

        // ==========================================
        //  TUTORIALS & LESSONS DATA
        // ==========================================

        const lessons = [
            {
                title: "1. Criando e Selecionando BD",
                desc: "Aprenda a criar um novo banco de dados e defini-lo como ativo.",
                sql: "CREATE DATABASE empresa;\nUSE empresa;\nSHOW DATABASES;"
            },
            {
                title: "2. Criando Tabelas",
                desc: "Crie uma tabela definindo tipos de dados como INT e VARCHAR.",
                sql: "USE empresa;\n\nCREATE TABLE funcionarios (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  nome VARCHAR(100),\n  cargo VARCHAR(50),\n  salario INT\n);"
            },
            {
                title: "3. Inserindo Dados (INSERT)",
                desc: "Adicione novos registros na tabela de funcionários.",
                sql: "USE empresa;\n\nINSERT INTO funcionarios (nome, cargo, salario) VALUES ('João Silva', 'Desenvolvedor', 5000);\nINSERT INTO funcionarios (nome, cargo, salario) VALUES ('Maria Santos', 'Designer', 4200);\nINSERT INTO funcionarios (nome, cargo, salario) VALUES ('Pedro Rocha', 'Gerente', 8000);"
            },
            {
                title: "4. Consultando Dados (SELECT)",
                desc: "Realize buscas simples e com filtros utilizando cláusula WHERE.",
                sql: "USE empresa;\n\n-- Buscar todos os registros\nSELECT * FROM funcionarios;\n\n-- Filtrar por salário maior que 4500\nSELECT nome, cargo FROM funcionarios WHERE salario > 4500;"
            },
            {
                title: "5. Atualizando Dados (UPDATE)",
                desc: "Altere dados existentes com o comando UPDATE e filtros WHERE.",
                sql: "USE empresa;\n\nUPDATE funcionarios SET salario = 5500 WHERE id = 1;\n\nSELECT * FROM funcionarios;"
            },
            {
                title: "6. Excluindo Dados (DELETE)",
                desc: "Remova registros específicos do banco de dados.",
                sql: "USE empresa;\n\nDELETE FROM funcionarios WHERE id = 2;\n\nSELECT * FROM funcionarios;"
            },
            {
                title: "7. Alterando Estrutura (ALTER TABLE)",
                desc: "Adicione novas colunas em uma tabela existente.",
                sql: "USE empresa;\n\nALTER TABLE funcionarios ADD departamento VARCHAR(50);\n\nSELECT * FROM funcionarios;"
            }
        ];

        function renderLessons() {
            const container = document.getElementById('lessons-list');
            container.innerHTML = '';

            lessons.forEach((l, index) => {
                const card = document.createElement('div');
                card.className = "bg-gray-800/60 border border-gray-700/60 p-3 rounded hover:border-teal-500/50 transition space-y-2";
                card.innerHTML = `
                    <div class="font-bold text-xs text-teal-300">${l.title}</div>
                    <div class="text-[11px] text-gray-400">${l.desc}</div>
                    <button onclick="loadLesson(${index})" class="w-full py-1 text-[11px] bg-gray-700 hover:bg-teal-700 text-gray-200 rounded transition font-medium">
                        Carregar Exemplo
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function loadLesson(index) {
            const lesson = lessons[index];
            if (lesson) {
                setQueryToEditor(lesson.sql);
            }
        }
    </script>
